name: Deploy to GitHub Pages

# Triggers: any push to main, or manual re-run from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; queue new pushes rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only ship the file the app actually needs.
      # index.html carries all data + CSS + JS inline. The other repo dirs
      # (reference/, docs/, data/, raw excluded) are dev / source material,
      # not served content — leaving them out shrinks the artifact and
      # keeps the deploy fast.
      - name: Assemble site (index.html only)
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
          echo "artifact contents:"
          ls -la _site/
          du -sh _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
